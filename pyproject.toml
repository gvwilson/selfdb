[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "selfconv"
version = "0.1.0"
description = "Converters between ELF and the SELF (SQLite) executable format"
requires-python = ">=3.11"
dependencies = [
    "lief",
    "ruff>=0.16.8",
]

[project.scripts]
self2elf = "selfconv.self2elf:main"
self = "selfconv.__main__:main"

[tool.setuptools]
packages = ["selfconv"]
